# Shorthand for the repo's common commands. Needs Task 3.x (https://taskfile.dev)
# and uv. `task` alone lists everything; `task --summary NAME` explains one.
# Extra arguments go after `--`, each passed through as one argument:
#
#   task t -- -k tag_normalizer
#   task tags -- "Untitled (1).csv" --out tag_mapping.csv
version: "3"

set: [errexit, nounset, pipefail]

vars:
  SRC: src
  # The arguments after `--`, shell-quoted one by one, so a path with spaces
  # or brackets stays one argument (plain CLI_ARGS would split it).
  ARGS: "{{range .CLI_ARGS_LIST}} {{shellQuote .}}{{end}}"

tasks:
  default:
    desc: List the tasks
    silent: true
    cmd: "{{.TASK_EXE}} --list"

  # --- internal ---------------------------------------------------------------------

  _uv:
    internal: true
    run: once
    preconditions:
      - sh: command -v uv
        msg: "uv is not installed: https://docs.astral.sh/uv/getting-started/installation/"

  _env-file:
    internal: true
    status: [test -f .env]
    cmd: cp .env.example .env

  _stopwords:
    internal: true
    deps: [_uv]
    # Exits 0 only when NLTK can already find the stopword list.
    status:
      - uv run python -c "import nltk; nltk.data.find('corpora/stopwords')"
    cmd: uv run python -c "import nltk; nltk.download('stopwords', quiet=True)"

  # --- setup ------------------------------------------------------------------------

  setup:
    desc: Install everything from uv.lock (dev tools, spaCy model), .env and NLTK stopwords
    summary: |
      Runs `uv sync` (always: it's quick when nothing changed, and repairs a
      missing or stale .venv), copies .env.example to .env if there is no
      .env, and downloads the NLTK stopword list if it isn't there yet.
    aliases: [s, i, install]
    deps: [_uv]
    cmds:
      - uv sync
      - task: _env-file
      - task: _stopwords

  reqs:
    desc: Re-export requirements.txt from uv.lock
    summary: |
      Always re-exports (it takes under a second). It deliberately has no
      sources/generates: Task's checksum method only checks that
      requirements.txt exists, so an emptied or hand-edited file was reported
      "up to date" and never repaired. --quiet stops uv also printing the
      whole file to the terminal. The last command fails if the file didn't
      come out as a uv export.
    aliases: [rq]
    deps: [_uv]
    cmds:
      - uv export --format requirements-txt --no-dev --no-hashes --quiet -o requirements.txt
      - cmd: grep -q '^# This file was autogenerated by uv' requirements.txt
        silent: true

  # --- run --------------------------------------------------------------------------

  run:
    desc: Start the desktop app (writes its output under the repo root)
    aliases: [r, app]
    deps: [_uv]
    cmd: uv run python {{.SRC}}/app.py

  tags:
    desc: Tag Normalizer CLI (task tags -- FILE [--backend spacy] [--out FILE] [--scripts DIR])
    summary: |
      Groups synonymous tags and writes a mapping or Zendesk retag scripts.
      Runs in the directory you call it from, so relative paths work as typed:
        task tags -- "Untitled (1).csv" --out tag_mapping.csv
        task tags -- tags.txt --backend spacy --threshold 0.8
        task tags -- tags.csv --scripts zendesk_retag_run
      The default backend (voyage) sends the tag names to Voyage AI.
    aliases: [tn]
    deps: [_uv]
    dir: "{{.USER_WORKING_DIR}}"
    env:
      PYTHONPATH: "{{.ROOT_DIR}}/{{.SRC}}"
    preconditions:
      - sh: test {{len .CLI_ARGS_LIST}} -gt 0
        msg: "Name a tag file: task tags -- FILE (or task tags -- --help)"
    cmd: uv run --project {{shellQuote .ROOT_DIR}} python -m tags.tag_normalizer{{.ARGS}}

  embed:check:
    desc: One tiny Voyage call to test the embedding key (no ticket text)
    aliases: [ec]
    deps: [_uv]
    dir: "{{.SRC}}"
    cmd: uv run python -m embedding.embeddings check

  embed:backfill:
    desc: Embed new or changed tickets with Voyage (paid; sends ticket text)
    aliases: [eb]
    deps: [_uv]
    dir: "{{.SRC}}"
    prompt: This sends ticket text to Voyage AI and is billed. Continue?
    cmd: uv run python -m embedding.embeddings backfill{{.ARGS}}

  # --- test -------------------------------------------------------------------------

  test:
    desc: Run the test suite (task t -- ARGS passes ARGS to pytest)
    aliases: [t]
    deps: [_uv]
    cmd: uv run pytest{{.ARGS}}

  test:quick:
    desc: Tests, stopping at the first failure, with short output
    aliases: [tq]
    deps: [_uv]
    cmd: uv run pytest -x -q{{.ARGS}}

  test:live:
    desc: The live model evaluation (paid; needs CHEAPER_INFERENCE_API_KEY)
    aliases: [tl]
    deps: [_uv]
    prompt: The live tests make paid model calls. Continue?
    env:
      RUN_LIVE_EVAL: "1"
    cmd: uv run pytest -k live{{.ARGS}}

  # --- lint and format --------------------------------------------------------------

  lint:
    desc: Static analysis with prospector (pylint, pyflakes, pycodestyle, ...)
    aliases: [l]
    deps: [_uv]
    cmd: uv run prospector {{.SRC}} --no-autodetect{{.ARGS}}

  fmt:check:
    desc: Report files isort and black would change, without changing them
    aliases: [fc]
    deps: [_uv]
    cmds:
      - uv run isort --check-only --diff {{.SRC}} tests
      - uv run black --check {{.SRC}} tests

  fmt:
    desc: Reformat with isort and black (rewrites files in place)
    aliases: [f]
    deps: [_uv]
    prompt: This rewrites source files in place (most of the repo isn't black-formatted yet). Continue?
    cmds:
      - uv run isort {{.SRC}} tests
      - uv run black {{.SRC}} tests

  check:
    desc: Lint, format check and tests; runs all three, fails if any failed
    summary: |
      Runs lint, fmt:check and test in turn, even after one fails, so one run
      shows every problem; then exits non-zero naming the ones that failed.
    aliases: [c, ci]
    deps: [_uv]
    cmd: |
      failed=""
      {{.TASK_EXE}} lint || failed="$failed lint"
      {{.TASK_EXE}} fmt:check || failed="$failed fmt:check"
      {{.TASK_EXE}} test || failed="$failed test"
      if [ -n "$failed" ]; then echo "Failed:$failed" >&2; exit 1; fi

  # --- build ------------------------------------------------------------------------

  build:
    desc: Build the standalone app with PyInstaller (skipped when nothing changed; --force rebuilds)
    summary: |
      Runs packaging/build.sh: dist/Lasso.app on macOS, dist/Lasso/ on Linux.
      PyInstaller doesn't cross-compile, and the script is bash, so it runs
      on macOS and Linux only. Rebuilds only when the sources below changed
      or dist/ is missing.
    aliases: [b]
    deps: [_uv]
    platforms: [darwin, linux]
    sources:
      - "{{.SRC}}/**/*.py"
      - "{{.SRC}}/tags/zendesk_retag/*"
      - "{{.SRC}}/tags/*.md"
      - packaging/**/*
      - uv.lock
      - exclude: "{{.SRC}}/**/__pycache__/**"
    generates: [dist/**/*]
    cmd: packaging/build.sh

  clean:
    desc: Remove build output and caches (not data, models or .env)
    aliases: [x]
    cmds:
      - rm -rf build dist .pytest_cache
      - find . -path ./.venv -prune -o -type d -name __pycache__ -exec rm -rf {} +
