[project]
name = "ml-data-wrangler"
version = "1.0.0"
description = ""
authors = [{ name = "Terry Arthur Brooks, Jr.", email = "Terry.Arthur@BrooksJr.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<4"
dependencies = [
    "anthropic>=1.11.0,<2",
    "bertopic>=0.17.4,<0.18",
    "boto3>=1.35",
    "en-core-web-lg",
    "gensim>=4.3.2",
    "hdbscan>=0.8.44",
    "loguru",
    "matplotlib",
    "nltk>=3.9.1",
    "pandas>=2.2",
    "pyldavis>=3.4.1,<4",
    "pymongo>=4.18.0,<5",
    "pyqt-siliconui",
    "PyQt5",
    "python-dotenv>=1.2.4",
    "pyyaml>=6",
    "numpy>=2,<3",
    "scipy>=1.13",
    "seaborn>=0.13.2,<0.14",
    "spacy>=3.8.7,<3.9",
    "umap-learn>=0.5.12",
    "validators>=0.34.0,<0.35",
    "voyageai>=0.3.2",
]

[dependency-groups]
dev = [
    "black",
    "isort",
    "mongomock",
    "moto[s3]>=5",
    "prospector",
    "pytest",
]
package = [
    "pyinstaller>=6.22.3",
]

[tool.uv]
# An application, not an installable package (was Poetry's package-mode = false).
package = false
# BERTopic requires sentence-transformers (and so PyTorch) to embed documents
# itself. bertopic_model passes the Voyage embeddings already stored on each
# ticket, so it never embeds; the never-true marker keeps PyTorch out.
override-dependencies = ["sentence-transformers; sys_platform == 'never'"]

[tool.uv.sources]
# spaCy models aren't on PyPI. 3.8.0 is the release for spaCy 3.8.x, hence the
# spacy <3.9 bound above.
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }
# PyQt-SiliconUI (the UI widgets) is only on PyPI as a 0.0.1 from before its widget
# refactor; pin the commit the app was styled against.
pyqt-siliconui = { git = "https://github.com/ChinaIceF/PyQt-SiliconUI", rev = "7005080698e3e813dd923898317788edc8f6b8da" }

[tool.isort]
profile = "black"
src_paths =  [
        "/Users/terry-brooks/GitHub/ML-Data-Wrangler/src",
        "/Users/terry-brooks/GitHub/ML-Data-Wrangler"
    ]
virtual_env = "./.venv/"
force_alphabetical_sort_within_sections = true
remove_redundant_aliases = true
dedup_headings = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
