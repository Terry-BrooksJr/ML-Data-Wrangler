[project]
name = "ml-data-wrangler"
version = "0.1.0"
description = ""
authors = [{ name = "Terry Arthur Brooks, Jr.", email = "Terry.Arthur@BrooksJr.com" }]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10,<4"
dependencies = [
    "anthropic>=1.11.0,<2",
    "boto3>=1.35",
    "en-core-web-lg",
    "gensim>=4.3.2",
    "loguru",
    "matplotlib",
    "nltk>=3.9.1",
    "pandas>=2.2",
    "pyldavis>=3.4.1,<4",
    "pymongo>=4.18.0,<5",
    "PyQt5",
    "python-dotenv>=1.2.4",
    "scipy==1.12",
    "seaborn>=0.13.2,<0.14",
    "spacy>=3.7.5,<3.8",
    "validators>=0.34.0,<0.35",
]

[dependency-groups]
dev = [
    "black",
    "isort",
    "mongomock",
    "moto[s3]>=5",
    "prospector",
    "pytest",
]
package = [
    "pyinstaller>=6.22.3",
]

[tool.uv]
# An application, not an installable package (was Poetry's package-mode = false).
package = false

[tool.uv.sources]
# spaCy models aren't on PyPI. 3.7.1 is the release for spaCy 3.7.x, hence the
# spacy <3.8 bound above.
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.7.1/en_core_web_lg-3.7.1-py3-none-any.whl" }

[tool.isort]
profile = "black"
src_paths =  [
        "/Users/terry-brooks/GitHub/ML-Data-Wrangler/src",
        "/Users/terry-brooks/GitHub/ML-Data-Wrangler"
    ]
virtual_env = "./.venv/"
force_alphabetical_sort_within_sections = true
remove_redundant_aliases = true
dedup_headings = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
