# Builds Lasso.app with PyInstaller and checks the built app starts.
# PyInstaller doesn't cross-compile, and the app ships for Apple Silicon, so
# this runs on an arm64 macOS runner.
#
# Pull requests build only when something that goes into the app changed; the
# build takes a while.
name: Installer

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "packaging/**"
      - pyproject.toml
      - uv.lock
      - .github/workflows/installer.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  macos-app:
    name: Build and launch Lasso.app
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build Lasso.app
        run: packaging/build.sh

      # A missing hidden import or data file only shows up when the bundle
      # runs. The app has no exit-after-start mode, so: launch it offscreen and
      # fail if it exits within 45 seconds.
      - name: Launch the built app
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          dist/Lasso.app/Contents/MacOS/Lasso >launch.log 2>&1 &
          pid=$!
          for _ in $(seq 45); do
            sleep 1
            if ! kill -0 "$pid" 2>/dev/null; then
              wait "$pid" && code=0 || code=$?
              echo "::error::Lasso exited after starting (exit code $code)"
              cat launch.log
              exit 1
            fi
          done
          kill "$pid"
          echo "Lasso was still running after 45s"
          cat launch.log
