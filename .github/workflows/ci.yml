# Tests (required), plus lint and format checks. The last two are report-only
# for now: most of the repo isn't black-formatted yet and prospector still finds
# ~185 messages. Drop their continue-on-error once those are cleaned up.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The app ships as a macOS .app, so test there as well as on Linux.
        os: [ubuntu-latest, macos-latest]
    env:
      # No display on the runners; the Qt tests render offscreen.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5

      - name: Install Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Python comes from .python-version; --locked fails if uv.lock is stale.
      - name: Install dependencies
        run: uv sync --locked

      # The live model evaluation stays skipped: RUN_LIVE_EVAL is never set here.
      - name: Run tests
        run: uv run pytest

  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: isort
        continue-on-error: true
        run: uv run isort --check-only --diff src tests

      - name: black
        continue-on-error: true
        run: uv run black --check src tests

      - name: prospector
        continue-on-error: true
        run: uv run prospector src --no-autodetect

  requirements:
    name: requirements.txt matches uv.lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7

      - name: Re-export and compare
        run: |
          uv export --format requirements-txt --no-dev --no-hashes --quiet -o requirements.txt
          git diff --exit-code requirements.txt || {
            echo "::error file=requirements.txt::Out of date with uv.lock; run 'task reqs' and commit it."
            exit 1
          }
  macos-pkg:
    name: Build and upload the macOS .pkg
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build Lasso.app
        run: packaging/build.sh

      - name: Build the installer
        run: packaging/build_pkg.sh

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: Lasso-macos-pkg
          path: dist/Lasso-*.pkg
          retention-days: 14
          compression-level: 0
  test-macos-pkg:
    name: Test the macOS .pkg
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Download the installer
        uses: actions/download-artifact@v4
        with:
          name: dist/Lasso-macos-pkg

          # The runner is throwaway, so install for real: this exercises the
      # installer's architecture and macOS version checks and the
      # /Applications install location, not just that productbuild ran.
      - name: Install the .pkg
        run: sudo installer -pkg dist/Lasso-*.pkg -target / -verboseR

      # A missing hidden import or data file only shows up when the bundle
      # runs. The app has no exit-after-start mode, so: launch it offscreen and
      # fail if it exits within 45 seconds.
      - name: Launch the installed app
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          /Applications/Lasso.app/Contents/MacOS/Lasso >launch.log 2>&1 &
          pid=$!
          for _ in $(seq 45); do
            sleep 1
            if ! kill -0 "$pid" 2>/dev/null; then
              wait "$pid" && code=0 || code=$?
              echo "::error::Lasso exited after starting (exit code $code)"
              cat launch.log
              exit 1
            fi
          done
          kill "$pid"
          echo "Lasso was still running after 45s"
          cat launch.log


