# Weekly update PRs for uv.lock and the actions in .github/workflows. Each uv
# PR runs CI, whose requirements job fails until requirements.txt is
# re-exported to match (task reqs).
version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
